[project]
name = "scraplink-backend"
version = "0.1.0"
description = "ScrapLink - AI-Driven B2B Industrial Scrap Exchange Platform Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core Framework
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    
    # Database
    "sqlalchemy==2.0.23",
    "psycopg2-binary==2.9.9",
    "pgvector==0.2.5",
    "alembic==1.12.1",
    
    # Configuration & Security
    "python-dotenv==1.0.0",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "email-validator==2.1.0",
    "python-jose[cryptography]==3.3.0",  # JWT support
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.0",
    
    # OTP & Communication
    "twilio==8.10.0",
    "httpx==0.25.1",
    
    # ML/AI (for later sprints)
    "numpy==1.26.2",
    "pandas==2.1.3",
    "scikit-learn==1.3.2",
    "xgboost==2.0.2",
    "matplotlib==3.8.2",
    "joblib==1.3.2",
    
    # Data Processing
    "beautifulsoup4==4.12.2",
    "lxml==4.9.3",
    "requests==2.31.0",
    "yfinance==0.2.33",
    "reportlab==4.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "black==23.12.0",
    "ruff==0.1.8",
    "mypy==1.7.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
scraplink = "app.main:main"

[dependency-groups]
dev = [
    "pytest==7.4.3",
    "black==23.12.0",
    "ruff==0.1.8",
    "mypy==1.7.1",
]

# ⭐ IMPORTANT: Tell hatchling where your code is
[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = [
    "/app",
    "/.env.example",
    "/README.md",
]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false