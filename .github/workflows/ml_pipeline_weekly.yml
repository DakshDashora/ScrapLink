name: Weekly ML Analysis

on:
  schedule:
    # Sunday at 10:00 PM IST = 16:30 UTC.
    - cron: "30 16 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weekly-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ML_PIPELINE_URL: https://scraplink-q4mo.onrender.com
      ML_JOB_TOKEN: ${{ secrets.ML_JOB_TOKEN }}

    steps:
      - name: Validate required secret
        shell: bash
        run: |
          if [[ -z "$ML_JOB_TOKEN" ]]; then
            echo "Repository secret ML_JOB_TOKEN is not configured."
            exit 1
          fi

      - name: Run weekly analysis
        shell: bash
        run: |
          curl --silent --show-error --fail-with-body \
            --max-time 900 \
            --retry 2 \
            --retry-delay 30 \
            --request POST "$ML_PIPELINE_URL/jobs/weekly-analysis" \
            --header "X-ML-Job-Token: $ML_JOB_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"request_id":"github-actions-weekly-analysis"}'
